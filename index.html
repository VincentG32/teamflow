<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — Gestion d'équipe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>

  <dialog id="confirm-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="confirm-title">Confirmation</h3>
        <p class="modal-subtitle" id="confirm-subtitle"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirm-cancel">Annuler</button>
        <button class="btn btn-danger" id="confirm-ok">Confirmer</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
